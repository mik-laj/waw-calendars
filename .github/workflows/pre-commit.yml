name: pre-commit

# Lint gate: run the same pre-commit hooks in CI. Only for the code branch —
# the `data` branch (generated artifacts) is intentionally excluded.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install pre-commit

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      # Docker-based hooks (shellcheck, hadolint) run fine on ubuntu runners.
      - run: pre-commit run --all-files --show-diff-on-failure
