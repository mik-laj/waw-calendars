name: wola-probe

# TEMPORARY diagnostic: from a GitHub-hosted runner, probe whether the Wola
# site is reachable and what its WAF returns. Safe (read-only, no commits).
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Show runner egress IP
        run: curl -s https://api.ipify.org; echo

      - name: Probe Wola + controls
        run: |
          set +e
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          FEED="https://wola.um.warszawa.pl/?p_p_id=com_liferay_asset_publisher_web_portlet_AssetPublisherPortlet_INSTANCE_jYdN6Vg9rRjn&p_p_lifecycle=2&p_p_state=normal&p_p_mode=view&p_p_resource_id=getRSS&p_p_cacheability=cacheLevelPage"
          ROOT="https://wola.um.warszawa.pl/"
          EVENT="https://wola.um.warszawa.pl/-/latajacy-teatr-sztuki-ciala-klaunadzinscy"

          code() { curl -s -o /dev/null -w "%{http_code}" "$@"; }

          echo "===== status codes ====="
          echo "A default-curl-UA feed:        $(code "$FEED")"
          echo "B browser-UA feed:             $(code -A "$UA" "$FEED")"
          echo "C browser-UA+headers feed:     $(code -A "$UA" -H 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8' -H 'Accept-Language: pl,en;q=0.8' -H "Referer: $ROOT" "$FEED")"
          echo "D browser-UA HTTP/1.1 feed:    $(code --http1.1 -A "$UA" "$FEED")"
          echo "E browser-UA root page:        $(code -A "$UA" "$ROOT")"
          echo "F browser-UA event subpage:    $(code -A "$UA" "$EVENT")"
          echo "-- controls (should be 200) --"
          echo "G expoxxi:                     $(code -A "$UA" 'https://expoxxi.pl/events_pl/')"
          echo "H waw4free:                    $(code -A "$UA" 'https://waw4free.pl/warszawa-wydarzenia-2026-8-9')"

          echo ""
          echo "===== response headers for feed (browser UA) — identify WAF ====="
          curl -s -D - -o /dev/null -A "$UA" "$FEED" | head -40

          echo ""
          echo "===== first 800 bytes of feed body (browser UA) ====="
          curl -s -A "$UA" "$FEED" | head -c 800; echo
