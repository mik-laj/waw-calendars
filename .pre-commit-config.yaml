# Pre-commit hooks. Install with:  pre-commit install
# Run on everything with:          pre-commit run --all-files
minimum_pre_commit_version: "3.5.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-case-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
      # We handle SSH deploy keys — guard against ever committing one.
      - id: detect-private-key
      # Keep the shell scripts consistent: shebang <-> executable bit.
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable

  # Python: lint (with autofix) and format.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Bash: static analysis of the orchestration scripts.
  # Docker-based so it needs no local shellcheck install and avoids the
  # shellcheck-py build (which requires a Python built with lzma).
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.10.0
    hooks:
      - id: shellcheck

  # Dockerfile: lint the add-on image. DL3008 (pin apt versions) is ignored on
  # purpose — pinning OS package versions is brittle for a home add-on.
  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint-docker
        args: [--ignore, DL3008]

  # GitHub Actions: validate workflow files against the official schema.
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.30.0
    hooks:
      - id: check-github-workflows
