# Pre-commit hooks. Install with:  pre-commit install
# Run on everything with:          pre-commit run --all-files
minimum_pre_commit_version: "3.5.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: mixed-line-ending
        args: [--fix=lf]

  # Python: lint (with autofix) and format.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Bash: static analysis of the orchestration scripts.
  # Docker-based so it needs no local shellcheck install and avoids the
  # shellcheck-py build (which requires a Python built with lzma).
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.10.0
    hooks:
      - id: shellcheck

  # GitHub Actions: validate workflow files against the official schema.
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.30.0
    hooks:
      - id: check-github-workflows
