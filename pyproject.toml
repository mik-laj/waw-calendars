[project]
name = "waw-calendars"
version = "0.1.0"
description = "Aggregates Warsaw event listings into subscribable iCal calendars."
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["waw_calendars"]
